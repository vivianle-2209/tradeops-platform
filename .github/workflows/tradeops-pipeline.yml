name: TradeOps Pipeline

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TradeOps pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
        run: |
          python run_pipeline.py

      - name: Commit refreshed operational data
        run: |
          git config user.name "tradeops-bot"
          git config user.email "tradeops-bot@users.noreply.github.com"

          git add data/processed
          git add data/state
          git add data/tradeops.duckdb

          git diff --cached --quiet || git commit -m "chore: refresh TradeOps operational data"

          git push