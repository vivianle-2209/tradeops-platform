name: TradeOps Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: tradeops-pipeline
  cancel-in-progress: false

jobs:
  run-tradeops-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run TradeOps pipeline
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_INCIDENTS_URL: ${{ secrets.N8N_INCIDENTS_URL }}
        run: |
          python run_pipeline.py

      - name: Upload pipeline outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tradeops-pipeline-output-${{ github.run_number }}
          path: |
            data/raw/
            data/cleaned/
            data/processed/
            data/state/
            logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Persist TradeOps database and state
        if: success()
        shell: bash
        run: |
          git config user.name "tradeops-bot"
          git config user.email "tradeops-bot@users.noreply.github.com"

          git add data/tradeops.duckdb

          if [ -f data/state/break_lifecycle.csv ]; then
            git add -f data/state/break_lifecycle.csv
          fi

          if [ -f data/state/dispatch_state.csv ]; then
            git add -f data/state/dispatch_state.csv
          fi

          if git diff --cached --quiet; then
            echo "No persistent TradeOps changes to commit."
          else
            git commit -m "Update TradeOps runtime data [skip ci]"
            git push origin HEAD:main
          fi